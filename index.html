<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="calculadora">
      <div class="historico"></div>
      <div class="visor"></div>
      <div class="teclado">
        <button class="especial" type="button">AC</button>
        <button class="especial" type="button">DEL</button>
        <button class="operador" type="button">%</button>
        <button class="operador" type="button">÷</button>

        <button class="numero" type="button">7</button>
        <button class="numero" type="button">8</button>
        <button class="numero" type="button">9</button>
        <button class="operador" type="button">×</button>

        <button class="numero" type="button">4</button>
        <button class="numero" type="button">5</button>
        <button class="numero" type="button">6</button>
        <button class="operador" type="button">-</button>

        <button class="numero" type="button">1</button>
        <button class="numero" type="button">2</button>
        <button class="numero" type="button">3</button>
        <button class="operador" type="button">+</button>

        <button class="numero" type="button">0</button>
        <button class="especial" type="button">.</button>
        <button class="especial" type="button" id="igual">=</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
